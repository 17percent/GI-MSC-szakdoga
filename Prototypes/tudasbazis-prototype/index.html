<html lang="hu">
<head>
  <meta charset="UTF-8">

  <!-- Téma-bootstrap a CSS betöltése ELŐTT, hogy ne villanjon (FOUC) -->
  <script>

  <link rel="stylesheet" href="tokens.css">

<body>

       tudasbazis-architektura-dontesi-naplo.md specifikáció alapján.
       Minden adat memóriában él (dummy), újratöltéskor visszaáll a seed.
       Design system: design.md (Hallmark · Cobalt, light + dark). -->

  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <div class="proto-badge" title="Ez egy eldobható prototípus — nem éles kód">Prototípus · adatok memóriában</div>

  <script src="data.js"></script>
